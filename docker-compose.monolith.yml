services:
  monolith-postgres:
    image: postgres:16-alpine
    container_name: monolith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courses}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - monolith_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-courses}"]
      interval: 10s
      timeout: 5s
      retries: 10

  monolith-mvp:
    build:
      context: .
      dockerfile: monolith-mvp/Dockerfile
    container_name: monolith-mvp
    restart: unless-stopped
    depends_on:
      monolith-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-postgres:5432/${POSTGRES_DB:-courses}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-8099}:8099"
    volumes:
      - monolith_files_data:/opt/app/data

volumes:
  monolith_pg_data:
  monolith_files_data:
