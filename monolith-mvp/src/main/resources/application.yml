server:
  port: ${SERVER_PORT:8099}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      dev:
        - h2
        - mail-noop
      stage:
        - pg
        - mail-smtp
      prod:
        - pg
        - mail-smtp
  application:
    name: monolith-mvp
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:200MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:200MB}

app:
  storage:
    root-dir: ${APP_STORAGE_ROOT_DIR:data}
    csp-frame-ancestors: ${APP_STORAGE_CSP_FRAME_ANCESTORS:}
  mail:
    from: ${APP_MAIL_FROM}
    invite-base-url: ${APP_MAIL_INVITE_BASE_URL}
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    jwt:
      # Для non-dev окружений задаётся ТОЛЬКО через env/secret-store.
      secret: ${APP_SECURITY_JWT_SECRET:N3D5d6WST02SfSOpfg2P7i3atHNZ0QF4whatT0Q5GtL}
      expiration-ms: ${APP_SECURITY_JWT_EXPIRATION_MS:86400000}
    password-reset:
      token-ttl: ${APP_SECURITY_PASSWORD_RESET_TOKEN_TTL:PT24H}
  bootstrap-admin:
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
    full-name: ${APP_BOOTSTRAP_ADMIN_FULL_NAME:System Admin}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/monolith-mvp-db;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: pg
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/courses}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

---
spring:
  config:
    activate:
      on-profile: mail-smtp
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    protocol: ${SPRING_MAIL_PROTOCOL}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
          ssl:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE}

---
spring:
  config:
    activate:
      on-profile: mail-noop
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

springdoc:
  api-docs:
    enabled: true

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-na}]"
