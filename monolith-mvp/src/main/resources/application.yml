server:
  port: 8099

spring:
  profiles:
    active: h2
  application:
    name: monolith-mvp
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

app:
  storage:
    user-avatar-dir: data/users/avatars
  mail:
    from: noreply@example.com
    invite-base-url: http://localhost:8099
  security:
    jwt:
      secret: 8w8QyQv7h8A7Z4f8mM2VnJ4kP6sT9xY1bW3cD5eF7gH9jK2
      expiration-ms: 86400000
  bootstrap-admin:
    password: admin123
    full-name: System Admin
    email: admin@local

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/monolith-mvp-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: pg
  datasource:
    url: jdbc:postgresql://localhost:5432/courses
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

---
